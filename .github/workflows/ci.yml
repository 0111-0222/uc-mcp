name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Refuse cookie files and session values
        run: |
          if git ls-files | grep -E '(^|/)(cookies\.json|.*\.har)$'; then
            echo "::error::A cookie file is tracked. It is a live UnknownCheats login." && exit 1
          fi
          if git grep -nE '(bbsessionhash|bbpassword|cf_clearance)=[A-Za-z0-9_.-]{20,}'; then
            echo "::error::A session cookie value is committed." && exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt pytest
      - run: pytest

  install:
    name: install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - if: runner.os != 'Windows'
        run: ./install.sh && test "$(stat -c %a cookies.json)" = 600
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1
